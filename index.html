<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>通用桌游模拟器 · Universal Board Game Engine</title>
    <link rel="preload" href="/fonts/Alibaba-PuHuiTi-Regular.woff" as="font" type="font/woff" crossorigin />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1117'/%3E%3Ctext x='32' y='44' font-size='38' font-family='Georgia,serif' font-style='italic' fill='%23d9b45b' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E"
    />
    <!-- Design tokens: primitives -> semantic -> themes. Component sheets
         below may only reference the semantic layer. -->
    <link rel="stylesheet" href="/apps/web/src/ui/tokens/primitives.css" />
    <link rel="stylesheet" href="/apps/web/src/ui/tokens/semantic.css" />
    <link rel="stylesheet" href="/apps/web/src/ui/tokens/themes.css" />
    <link rel="stylesheet" href="/apps/web/src/ui/styles.css" />
    <link rel="stylesheet" href="/apps/web/src/ui/dock-fan.css" />
    <link rel="stylesheet" href="/apps/web/src/ui/layout-phase0.css" />
    <link rel="stylesheet" href="/apps/web/src/ui/layout-shell.css" />
    <link rel="stylesheet" href="/apps/web/src/ui/a11y.css" />
    <link rel="stylesheet" href="/apps/web/src/ui/dice-overlay.css" />
    <link rel="stylesheet" href="/apps/web/src/ui/theme-gothic.css" />
  </head>
  <body>
    <div id="lobby-root" class="lobby-root" hidden></div>
    <div id="admin-root" class="admin-root" hidden></div>
    <div id="app">
      <div id="canvas-container"></div>
      <div class="stage-vignette"></div>
      <div id="hud-container" class="ui-layer"></div>
      <div id="inspector-container" class="ui-layer"></div>
      <div id="toast-container" class="toast-stack"></div>
      <div id="boot-screen" class="boot-screen">
        <div class="boot-mark">𝒢</div>
        <h1>通用桌游模拟器</h1>
        <p class="boot-sub">EXTENDED FACTORIZED OBSERVATION STOCHASTIC GAME</p>
        <p class="boot-desc">
          以九元组 ⟨𝒩, 𝒮, s₀, 𝒜, ℒ, 𝒯, 𝒪, ℛ, 𝒦⟩ 统一形式化一切桌面博弈、<br />
          三维物理桌面 · 确定性内核 · 实时数学模型可视化
        </p>
        <button id="boot-enter" class="boot-btn">进入牌局</button>
        <div id="boot-commit" class="boot-commit"></div>
        <div class="boot-hint">建议使用 Chrome / Edge · 支持 WebGL2</div>
      </div>
    </div>
    <script type="module" src="/apps/web/src/shell.ts"></script>
  </body>
</html>
